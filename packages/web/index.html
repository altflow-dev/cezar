<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: engines that honor it shrink the viewport under the virtual
         keyboard themselves; the visualViewport --kb watcher (lib/keyboard-inset.ts) is the
         required iOS fallback beneath it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Relative so Vite bundles the legacy logo out of web/ instead of duplicating it under a public dir. -->
    <link rel="icon" href="/icon.svg" />
    <!-- Installable app (Chrome/Edge "Install", Safari "Add to Dock"). No service worker on
         purpose: the shell is `no-cache` so a rebuilt cockpit lands on the next reload, and a
         caching worker would bring back exactly the stale-app problem that header fixed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-title" content="cezar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>cezar</title>
    <!-- Theme before first paint — no flash. Mirrors resolveTheme()/applyResolvedTheme() in
         src/lib/theme.ts; keep the two in sync. Shares the legacy cockpit's `cez-theme` key
         ('light' | 'dark' | 'system'); anything else falls back to dark, as legacy does. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cez-theme')
          var light =
            pref === 'light' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.toggle('light', light)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {
          // Storage or matchMedia unavailable — the default dark tokens already apply.
        }
        // Accent + density before first paint, from the localStorage MIRROR of ui-state.json
        // (src/lib/appearance.ts owns the contract; keep the two in sync). Defaults are the
        // absence of the attribute, so only the known deviations are stamped.
        try {
          if (localStorage.getItem('cez-accent') === 'violet')
            document.documentElement.dataset.accent = 'violet'
          var density = localStorage.getItem('cez-density')
          if (density === 'compact' || density === 'ultra')
            document.documentElement.dataset.density = density
          if (localStorage.getItem('cez-width') === 'wide')
            document.documentElement.dataset.width = 'wide'
        } catch (e) {
          // Storage unavailable — lime/comfortable defaults already apply.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
